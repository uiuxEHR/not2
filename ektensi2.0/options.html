<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>EMR Assesmen Monitor - Opsi</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; color: #0f2233; }
  h1 { font-size: 18px; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px; border: 1px solid #b8c7d2; border-radius: 8px; }
  button { margin: 14px 8px 0 0; padding: 9px 16px; font-size: 14px; border: 0; border-radius: 8px; background: #0d9488; color: #fff; cursor: pointer; }
  button.sec { background: #64788a; }
  #st { margin-top: 16px; font-size: 13px; min-height: 18px; }
  .ok { color: #16a34a; } .bad { color: #c62d3a; } small { color: #64788a; }
</style>
</head>
<body>
<h1>EMR Assesmen Monitor</h1>
<small>Token diberikan administrator (khusus untuk komputer ini). Jangan dibagikan.</small>
<label for="tk">Token perangkat</label>
<input id="tk" type="password" autocomplete="off" spellcheck="false" placeholder="tempel token di sini">
<button id="save">Simpan</button><button id="test" class="sec">Tes koneksi</button><button id="clear" class="sec">Hapus token</button>
<div id="st" role="status"></div>
<script src="config.js"></script>
<script src="options.js"></script>
</body>
</html>
